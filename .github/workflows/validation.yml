name: Validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    container: swift:6.0.3-jammy@sha256:ae8eacc602559b7060d5aabdfcdf69f79a9fcaac778162ec1be291b71c018331
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare loopback transport fixtures
        run: |
          apt-get update -qq
          apt-get install --yes --no-install-recommends python3 curl ca-certificates
      - name: Test the production Foundation module
        shell: bash
        run: |
          set -euo pipefail
          # Do not let a Linux-only graph rewrite the desktop dependency lock.
          validation_root="$(mktemp -d)"
          tar --exclude=.git --exclude=.build --exclude=Package.resolved -cf - Package.swift Sources Tests | tar -xf - -C "$validation_root"
          (
            cd "$validation_root"
            swift test -j 2
          )
      - name: Exercise the production curl transport on loopback
        run: python3 Scripts/test_compose_transport.py

  desktop:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [debug, release, tsan]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned SwiftGen
        shell: bash
        run: bash Scripts/ci_install_swiftgen.sh
      - name: Native application checks (${{ matrix.lane }})
        shell: bash
        env:
          PM_CI_LANE: ${{ matrix.lane }}
        run: bash Scripts/ci_native_checks.sh "$PM_CI_LANE"
